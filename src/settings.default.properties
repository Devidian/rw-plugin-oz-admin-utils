
# possible values: OFF,FATAL,ERROR,WARN,INFO,DEBUG,TRACE,ALL
logLevel=ALL
reloadOnChange=true

# send plugin welcome message to player on login
enableWelcomeMessage=false
# optional info panel shown to players until they opt out
newPlayerInfo.enabled=false
newPlayerInfo.text=
# centered panel size as percentage of the screen
newPlayerInfo.widthPercent=42
newPlayerInfo.heightPercent=36

# automatic raw chunk capture for backend map rendering
enableMapGen=false
# restrict automatic map capture triggers to admin players
onlyAdminMapGen=true
# filled square scan radius around the departed chunk (0-5)
mapGenChunkScanRadius=0
# minimum seconds before the same chunk can trigger another capture
mapGenChunkCooldownSeconds=60

# future native plugin route exposure flags
exposeMapData=true
exposePluginList=true
exposePlayerData=true
# live map position sample interval while player exposure is enabled (1-30 seconds)
livePlayerPositionIntervalSeconds=1
exposeServerConfig=true
exposeWorldAreas=true

# enable mount ownership feature, which allows players to claim ownership of mounts and prevents other players from stealing them
enableMountOwnership=true
# taking ownership of mounts is only possible in areas where the player has area_addplayer permission, this prevents players from claiming ownership of mounts in areas they don't have access to
forceAreaOwnership=true
# punish thiefs for stealing mounts
punishMountTheft=true

# Prison feature is off until enabled and at least one prison zone exists.
# If enabled but no prison is configured, theft punishment keeps using the current kick/ban fallback.
enablePrison=false
# shows the shared Tools prison-zone indicator while players stand inside an enabled prison area
showPrisonZoneIndicator=true
# game-time minutes for theft punishments that would currently kick a player
prisonTheftKickSentenceGameMinutes=10
# real-time minutes for theft punishments that would currently ban a player
prisonTheftBan3SentenceRealMinutes=10
prisonTheftBan4SentenceRealMinutes=30
prisonTheftBan5SentenceRealMinutes=60
prisonTheftBan6SentenceRealMinutes=1440
prisonTheftBan7SentenceRealMinutes=10080
prisonTheftBan8SentenceRealMinutes=525600
prisonTheftBan9SentenceRealMinutes=5256000

# send sleep announcements to players
enableSleepAnnouncement=false
# kick players that are afk while others want to sleep
enableSleepKickAFKPlayer=false
# afk timeout in seconds until a sleeping player is kicked
afkPlayerSleepTimeoutSeconds=180
# minimum afk time to warn a player before kicking them for being afk while others want to sleep
afkPlayerSleepWarnSeconds=30
# game internal sleep time is between 21:00 and 7:00 by default, you can change this if you have changed the sleep time in your server config
upperSleepTimeHour=21
lowerSleepTimeHour=7
# if this setting is enabled, game time is sped up when atleast 50% of the players are sleeping, this allows players to skip the night faster, but it can cause issues with some plugins that rely on game time, use with caution
enableSpeedUpTime=false
# discord channel id for sleep-related events like time speed reset after enough players slept
discordSleepEventChannelId=0

# Event logging
# Prison theft replacement uses the theft report channel for Discord broadcasts.
enablePlayerDeathLogging=true
enablePlayerStatusLogging=true
enablePlayerRemoveObjectLogging=false
enablePlayerDestroyObjectLogging=false
enableNpcDeathByNonPlayerLogging=false
enableMountDeathByPlayerLogging=true
enableAnimalDeathByPlayerLogging=false
enableAllAnimalDeathByPlayerLogging=false
enableSeasonChangeEventLogging=false
enableWeatherChangeEventLogging=false
enablePlayerTeleportEventLogging=true

# Discord settings (optional)
# Discord channel IDs (0 disables the corresponding notification)
# set to 0 to disable discord notifications for that event
discordTheftReportChannelId=0
discordPlayerDeathChannelId=0
discordPlayerStatusChannelId=0
discordPlayerRemoveObjectChannelId=0
discordPlayerDestroyObjectChannelId=0
discordNpcDeathByNonPlayerChannelId=0
discordMountDeathByPlayerChannelId=0
discordAnimalDeathByPlayerChannelId=0
discordSeasonChangeEventChannelId=0
discordWeatherChangeEventChannelId=0
discordPlayerTeleportChannelId=0
